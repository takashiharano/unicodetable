<style>
:root {
  --text-0: #edf3f7;
  --border-1: #334451;
  --border-2: #405766;
  --table-border: #a9b8ce;
  --line-blue: #1883d7;
  --line-blue2: #1469ac;
}

html {
  min-height: 100%;

  background: linear-gradient(135deg, #0f171d 0%, #0e161c 55%, #0c151b 100%);

  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
}

body {
  min-height: 100vh;
  margin: 0;
  box-sizing: border-box;
  background: transparent;
  color: #fff;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

h1, h2 {
  display: inline;
  margin: 0;
  font-family: Meiryo;
}

h1 {
  font-size: 28px;
}

a {
  color: #cff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

input[type="text"], textarea {
  color: #fff;
  font-size: 16px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
  outline: none;
}

input[type="text"] {
  border: none;
  border-bottom: 1px solid #666;
  background: transparent;
  transition: all ease .5s;
}

input[type="text"]:focus {
  border-color: #51a7e8;
}

textarea {
  min-height: 34px;
  padding: 2px 5px;
  vertical-align: middle;
  border: 1px solid var(--line-blue2);
  border-radius: 4px;
  box-shadow: inset 0 1px 2px rgb(32 32 32 / .075);
  transition: all ease .5s;
}

textarea:focus {
  border-color: #51a7e8;
  box-shadow: inset 0 1px 2px rgb(0 0 0 / .075), 0 0px 5px rgb(81 167 232 / .5);
}

button, input[type="button"], input[type="submit"] {
  height: 24px;
  padding: 0 10px;

  font-size: 14px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
  color: var(--text-0);

  background:
    linear-gradient(
      180deg,
      #1a242d,
      #121a21
    );

  border: 1px solid var(--border-1);
  border-radius: 3px;
  outline: none;

  box-shadow:
    inset 0 1px 0 rgba(140, 190, 220, 0.08),
    0 1px 2px rgba(0, 0, 0, 0.45);

  cursor: pointer;

  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.06s ease;
}

button:not(:disabled):hover,
input[type="button"]:not(:disabled):hover,
input[type="submit"]:not(:disabled):hover {
  background: linear-gradient(180deg, #202d38, #17222b);
  border-color: var(--border-2);
  box-shadow:
    inset 0 1px 0 rgba(150, 205, 235, 0.10),
    0 1px 3px rgba(0, 0, 0, 0.48);
}

button:not(:disabled):active,
input[type="button"]:not(:disabled):active,
input[type="submit"]:not(:disabled):active {
  background: linear-gradient(180deg, #111820, #0d141a);
  transform: translateY(1px);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.55);
}

button:disabled,
input[type="submit"]:disabled {
  color: #56646e;

  background:
    linear-gradient(
      180deg,
      #11171c,
      #0d1216
    );

  border-color: #202a31;

  box-shadow: none;

  cursor: default;
  transform: none;
}

.small-button {
  height: 14px;
  font-size: 11px;
}

.button-active {
  color: #ffffff !important;
  background: linear-gradient(180deg, #23506c, #17384d) !important;
  border-color: #3f91c4;
  box-shadow:
    inset 0 1px 0 rgba(185, 228, 250, 0.18),
    inset 0 -1px 0 rgba(5, 35, 55, 0.50),
    0 0 0 1px rgba(22, 127, 200, 0.14),
    0 0 6px rgba(22, 127, 200, 0.24),
    0 1px 2px rgba(0, 0, 0, 0.45);
}

.button-active:hover {
  background:
    linear-gradient(
      180deg,
      #2a5d7d,
      #1a425a
    ) !important;

  border-color: #52a2d3;

  box-shadow:
    inset 0 1px 0 rgba(195, 235, 252, 0.20),
    inset 0 -1px 0 rgba(5, 35, 55, 0.48),
    0 0 0 1px rgba(28, 139, 216, 0.16),
    0 0 7px rgba(22, 127, 200, 0.28),
    0 1px 2px rgba(0, 0, 0, 0.45);
}

select {
  height: 24px;
  padding: 0 24px 0 8px;
  font-size: 14px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
  color: var(--text-0);
  background: linear-gradient(180deg, #19242d, #111920);
  border: 1px solid #3a4a56;
  border-radius: 3px;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(130, 185, 215, 0.06), 0 1px 2px rgba(0, 0, 0, 0.38);
  cursor: pointer;
  color-scheme: dark;
  transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}

select:hover {
  background: linear-gradient(180deg, #1f2c36, #16212a);
  border-color: #536b7c;
}

select:focus {
  box-shadow: 0 0 0 2px rgba(22, 127, 200, 0.20), inset 0 1px 0 rgba(150, 205, 235, 0.07);
}

select:disabled {
  color: #596873;
  background: linear-gradient(180deg, #11171c, #0d1216);
  border-color: #222c33;
  box-shadow: none;
  cursor: default;
}

select option {
  color: #e8f0f5;
  background-color: #1b1f22;
}

select option:checked {
  color: #ffffff;
  background-color: #188bd8;
  box-shadow: 0 0 0 100vmax #188bd8 inset;
  -webkit-text-fill-color: #ffffff;
}

select option:hover {
  color: #fff;
  background: #1c8bd8;
}

input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;

  width: 13px;
  height: 13px;
  margin: 0 3px 0 0;

  vertical-align: -2px;

  background:
    linear-gradient(
      180deg,
      #18232c,
      #10181f
    );

  border: 1px solid #3a4b57;
  border-radius: 2px;
  outline: none;

  box-shadow:
    inset 0 1px 0 rgba(130, 185, 215, 0.06);

  cursor: pointer;

  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease;
}

input[type="checkbox"]:hover {
  background: linear-gradient(180deg, #1e2b36, #141f28);
  border-color: #526b7d;
}

input[type="checkbox"]:checked {
  background: linear-gradient( 180deg, #218bd0, #126eaf);
  border-color: #3199db;
  box-shadow:
    inset 0 1px 0 rgba(190, 230, 250, 0.18),
    0 0 4px rgba(22, 127, 200, 0.28);
}

input[type="checkbox"]:checked::after {
  content: "";
  display: block;
  width: 6px;
  height: 3px;
  margin: 3px 0 0 2px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg);
}

input[type="checkbox"]:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--focus);
}

pre {
  margin: 0;
  padding: 0;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

.line {
  width:100%;
  height: 1px;
  border: none;
  border-top: 1px solid var(--line-blue);
  margin: 0 0 4px 0;
}

.hex {
  font-size: 9px;
}

table.unicode {
  width: 890px;
  border: solid 1px var(--table-border);
  border-collapse: collapse;
  border-spacing: 1px;
  empty-cells: show;
  background: #fff;
  color: #000;
  font-size: 14px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

th {
  border: solid 1px var(--table-border);
  padding: 0 6px;
  background: #9cf;
  text-align: center;
  color: #000;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
  font-weight: normal;
}

td.unicode-body {
  border: solid 1px var(--table-border);
  padding: 0 6px;
  text-align: center;
  font-size: 14px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

.ctrl-char {
  color: #00a;
}

.ctrl-char-l {
  color: #bdf;
}

.unicode-body:hover {
  background: #dcf6ff;
}

.ch-selected {
  background: #dcfce4 !important;
}

.jump-button {
  min-width: 64px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

.codeblock-button {
  min-width: 64px;
  font-size: 12px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

.small-button2 {
  min-width: 32px;
};

#main {
  position: relative;
}

#content {
  position: relative;
  top:8px;
  width: 1336px;
  margin: auto;
}

.code-area {
  display: flex;
  align-items: flex-start;
}

#code-table-wrapper {
  position: relative;
  flex: 0 0 auto;
}

.code-side {
  width: 320px;
  flex: 0 0 320px;
}

#code-info {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  height: 350px;
  margin-left: 4px;
  border: 1px solid var(--line-blue);
  padding: 4px;
  background:
    linear-gradient(
      180deg,
      #10181e,
      #0e161c
    );
}

#codepoint {
  color: #bf8;
}

#char-wrapper1 {
  display: inline-block;
  height: 60px;
  font-size: 46px;
}

#char-wrapper {
  display: table;
  height: 100%;
}

#char {
  display: table-cell;
  height: 100%;
  vertical-align: middle;
}

#cp-name {
  position: relative;
  top: -8px;
  height:10px;
  font-size: 12px;
}

#point-val {
  margin-top: 12px;
  font-size: 14px;
}

.led {
  padding-left: 4px;
  margin-right: 2px;
}

#text {
  width: 880px;
  height: 64px;
  background: transparent;
  color: #fff;
  font-size: 13px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
}

#unicodeescape {
  width: 880px;
  height: 45px;
  border: none;
  background: transparent;
  color: #ccc;
  font-size: 13px;
  font-family: Consolas, Monaco, Menlo, monospace, sans-serif;
  resize: none;
}

#unicodeescape:focus {
  box-shadow: none;
}

unicode.DFLT_ROWS = 16;
unicode.ROWS_MAX = 1024;
unicode.start = -1;
unicode.currentStart = 0;
unicode.displayedPoint = -1;
unicode.lockedPoint = -1;
unicode.rows = unicode.DFLT_ROWS;

unicode.LED_IDS = ['bmp', 'smp', 'sip', 'tip', 'ssp', 'pua1', 'pua2', 'u0000', 'u0370', 'u0400', 'u0600', 'u0e00', 'u2000', 'u3040', 'u3100', 'u3400','uac00', 'ud800', 'ue000', 'uf900', 'ufe00', 'uff00', 'uff60', 'u1f300', 'ue0100', 'p4', 'p5', 'p6', 'p7', 'p8', 'p9', 'p10', 'p11', 'p12', 'p13', 'u10ffff'];
unicode.LEDs = {};

$onLoad = function() {
  util.tooltip.setDelay(300);

  var start = util.getQuery('start');
  var point = util.getQuery('p');
  var ch = util.getQuery('ch');
  var rows = util.getQuery('rows');

  if (start != null) {
    start |= 0;
  }

  if (point == null) {
    point = -1;
  } else {
    point |= 0;
    $el('#target-point').value = util.lpad(point, '0', 4);
  }

  if (ch != null) {
    ch = decodeURIComponent(ch);
    $el('#target-char').value = ch;
  }

  if (rows) {
    $el('#rows').value = rows;
  }

  $el('#chk-tooltip').addEventListener('change', unicode.onChangeTooltip);
  util.textarea.addListener('#text', unicode.textareaListener);

  unicode.initLeds();
  unicode.showTable(start, point, ch, rows);
  unicode.setButtonStyle();
};

unicode.initLeds = function() {
  for (var i = 0; i < unicode.LED_IDS.length; i++) {
    var id = unicode.LED_IDS[i];
    unicode.LEDs[id] = new util.Led('#led-' + id, false);
  }
};

unicode.allLedOff = function() {
  for (var id in unicode.LEDs) {
    var led = unicode.LEDs[id];
    led.off();
  }
};

unicode.ledOn = function(id) {
 var led = unicode.LEDs[id];
 led.on();
};

unicode.ledOff = function(id) {
 var led = unicode.LEDs[id];
 led.off();
};

unicode.onClickCodeblock = function(button, codePoint) {
  unicode.showTable(codePoint);
  $el(button).addClass('button-active');
};

unicode.showTable = function(startPoint, targetPoint, targetCh, rows) {
  var updateLock = (targetPoint !== undefined || targetCh !== undefined);

  if (targetPoint > unicode.MAX_POINT) {
    util.infotip.show('Out of range: U+' + targetPoint.toString(16) + ' (U+0000 - U+10FFFF)', 3000);
    return;
  }

  if (!rows) {
    rows = $el('#rows').value;
  }

  if (targetCh != undefined) {
    targetPoint = unicode.ch2point(targetCh);
  }

  if (targetPoint === undefined) {
    targetPoint = -1;
  }

  if (updateLock) {
    unicode.lockedPoint = targetPoint;
    if (targetPoint != -1) {
      unicode.showDetails(targetPoint);
    }
  }

  var start = startPoint;

  if (updateLock && targetPoint != -1) {
    if ((start == undefined) || (start == -1)) {
      if (rows < 16) {
        start = targetPoint - (0x10 * Math.floor(rows / 2));
      } else {
        start = targetPoint - 0x70
      }
    }
  }

  if (start < 0) start = 0;

  if (updateLock && targetPoint > 0) {
    if (start <= targetPoint) {
      if (targetPoint - start >= 256) {
        start = targetPoint;
      }
    } else {
      if (start - targetPoint >= 256) {
        start = targetPoint;
      }
    }
  }

  if (updateLock && (startPoint == -1) && (targetPoint != -1) && (targetPoint >= 0) && (targetPoint <= 255)) {
    start = 0;
  }

  unicode.start = start;

  var html = unicode.createTable(start, rows);
  $el('#code-table').innerHTML = html;
  unicode.applyTooltipState();

  var font = $el('#char-font').value;
  unicode.setTableFont(font);

  var tblBody = document.getElementsByClassName('unicode-body');

  $el('#code-table').addEventListener('wheel', unicode.onWheel, {passive: false});
};

unicode.createTable = function(start, rows) {
  if (rows == '') {
    rows = unicode.DFLT_ROWS;
  }

  unicode.rows = rows;

  var startPoint = start | 0;

  if (startPoint < 0) {
    startPoint = 0;
  }

  var offset = startPoint % 16;

  if (offset > 0) {
    startPoint -= offset;
  }

  unicode.currentStart = startPoint;

  unicode.prevPgPoint = startPoint - (16 * unicode.rows);
  unicode.prevRowPoint = startPoint - 16;
  unicode.nextRowPoint = startPoint + 16;
  unicode.nextPgPoint = startPoint + (16 * unicode.rows);

  if (!rows || rows < 0) {
    rows = unicode.DFLT_ROWS;
  } else if (rows > unicode.ROWS_MAX) {
    rows = unicode.ROWS_MAX;
  }

  var html = '';
  html += '<table class="unicode">';
  html += '<tr>';
  html += '  <th nowrap>&nbsp;</th>';
  html += '  <th width="36">+0<br><span class="hex">0000</span></th>';
  html += '  <th width="36">+1<br><span class="hex">0001</span></th>';
  html += '  <th width="36">+2<br><span class="hex">0010</span></th>';
  html += '  <th width="36">+3<br><span class="hex">0011</span></th>';
  html += '  <th width="36">+4<br><span class="hex">0100</span></th>';
  html += '  <th width="36">+5<br><span class="hex">0101</span></th>';
  html += '  <th width="36">+6<br><span class="hex">0110</span></th>';
  html += '  <th width="36">+7<br><span class="hex">0111</span></th>';
  html += '  <th width="36">+8<br><span class="hex">1000</span></th>';
  html += '  <th width="36">+9<br><span class="hex">1001</span></th>';
  html += '  <th width="36">+A<br><span class="hex">1010</span></th>';
  html += '  <th width="36">+B<br><span class="hex">1011</span></th>';
  html += '  <th width="36">+C<br><span class="hex">1100</span></th>';
  html += '  <th width="36">+D<br><span class="hex">1101</span></th>';
  html += '  <th width="36">+E<br><span class="hex">1110</span></th>';
  html += '  <th width="36">+F<br><span class="hex">1111</span></th>';
  html += '</tr>';

  var basePoint = startPoint;

  for (var i = 0; i < rows; i++) {
    if (basePoint > unicode.MAX_POINT) break;

    var basePointHex = util.toHex(basePoint, true);
    var basePointBin = util.toBin(basePoint, 16);
    var basePointHeadingBin = basePointBin.substr(0, 12) + 'xxxx';

    html += '<tr>';
    html += '<th>';
    html += util.lpad(basePointHex, '0', 4);
    html += '<br>';
    html += '<span class="hex">' + basePointHeadingBin + '</span>';
    html += '</th>';

    for (var j = 0; j < 16; j++) {
      var point = basePoint + j;
      var pointBin = util.toBin(point, 16);
      var pointHex = util.toHex(point, true);
      var ch = '&#' + point;
      var utf8 = unicode.dumpUTF8Bytes(point);
      var chClz = '';
      var pointDef = unicode.CTRL_CHRS[point];

      if (pointDef) {
        if (pointDef.chr) ch = pointDef.chr;
        chClz = 'ctrl-char';
      }

      var hex = util.lpad(pointHex, '0', 2);
      var tooltip = 'HEX: ' + hex + '\n';
      tooltip += 'DEC: ' + point + '\n';
      tooltip += 'BIN: ' + pointBin + '\n';
      tooltip += '\n';
      tooltip += 'UTF-8: ' + utf8 + '\n';

      var clz = 'unicode-body';

      if (chClz) {
        clz += ' ' + chClz;
      }

      if ((unicode.lockedPoint != -1) && (point == unicode.lockedPoint)) {
        clz += ' ch-selected';
      }

      html += '<td class="' + clz + '" data-code-tooltip="' + tooltip + '" ondblclick="unicode.toggleCharacterLock(0x' + pointHex + ');" onmouseover="unicode.onHoverCh(0x' + pointHex + ');" onmouseout="unicode.onOutCh();">' + ch + '</td>';
    }

    html += '</tr>';
    basePoint += 16;
  }

  html += '</table>';

  util.removeClass('.codeblock-button', 'button-active');
  unicode.updateLed(start);
  return html;
};

unicode.updateLed = function(v) {
  unicode.allLedOff();

  var ledId = 'bmp';

  if (v >= 0x10000) ledId = 'smp';
  if (v >= 0x20000) ledId = 'sip';
  if (v >= 0x30000) ledId = 'tip';
  if (v >= 0x40000) ledId = 'p4';
  if (v >= 0x50000) ledId = 'p5';
  if (v >= 0x60000) ledId = 'p6';
  if (v >= 0x70000) ledId = 'p7';
  if (v >= 0x80000) ledId = 'p8';
  if (v >= 0x90000) ledId = 'p9';
  if (v >= 0xA0000) ledId = 'p10';
  if (v >= 0xB0000) ledId = 'p11';
  if (v >= 0xC0000) ledId = 'p12';
  if (v >= 0xD0000) ledId = 'p13';
  if (v >= 0xE0000) ledId = 'ssp';
  if (v >= 0xF0000) ledId = 'pua1';
  if (v >= 0x100000) ledId = 'pua2';

  unicode.ledOn(ledId);

  ledId = '';

  if (unicode.inRange(v, 0x000, 0x007F)) {
    ledId = 'u0000';
  } else if (unicode.inRange(v, 0x0370, 0x03FF)) {
    ledId = 'u0370';
  } else if (unicode.inRange(v, 0x0400, 0x052F)) {
    ledId = 'u0400';
  } else if (unicode.inRange(v, 0x0600, 0x06FF)) {
    ledId = 'u0600';
  } else if (unicode.inRange(v, 0x0E00, 0x0E7F)) {
    ledId = 'u0e00';
  } else if (unicode.inRange(v, 0x2000, 0x2DFF)) {
    ledId = 'u2000';
  } else if (unicode.inRange(v, 0x3040, 0x30FF)) {
    ledId = 'u3040';
  } else if (unicode.inRange(v, 0x3100, 0x312F)) {
    ledId = 'u3100';
  } else if (unicode.inRange(v, 0x3400, 0x9FFF)) {
    ledId = 'u3400';
  } else if (unicode.inRange(v, 0xAC00, 0xD7AF)) {
    ledId = 'uac00';
  } else if (unicode.inRange(v, 0xD800, 0xDFFF)) {
    ledId = 'ud800';
  } else if (unicode.inRange(v, 0xE000, 0xF8FF)) {
    ledId = 'ue000';
  } else if (unicode.inRange(v, 0xF900, 0xFAFF)) {
    ledId = 'uf900';
  } else if (unicode.inRange(v, 0xFE00, 0xFE0F)) {
    ledId = 'ufe00';
  } else if (unicode.inRange(v, 0xFF00, 0xFF5F)) {
    ledId = 'uff00';
  } else if (unicode.inRange(v, 0xFF60, 0xFF9F)) {
    ledId = 'uff60';
  } else if (unicode.inRange(v, 0x1F300, 0x1F5FF)) {
    ledId = 'u1f300';
  } else if (unicode.inRange(v, 0xE0100, 0xE01EF)) {
    ledId = 'ue0100';
  } else if (unicode.inRange(v, 0x10FFFF, 0x10FFFF)) {
    ledId = 'u10ffff';
  }

  if (ledId) unicode.ledOn(ledId);
};

unicode.inRange = function(v, s, e) {
  return ((s <= v) && (v <= e));
};

unicode.onHoverCh = function(point) {
  if (unicode.lockedPoint == -1) {
    unicode.showDetails(point);
    util.removeClass('.codeblock-button', 'button-active');
    unicode.updateLed(point);
  }
};

unicode.onOutCh = function() {
  if (unicode.target == -1) {
    unicode.showDetails(-1);
    unicode.updateLed(-1);
  }
};

unicode.showDetails = function(point) {
  if (point < 0) {
    unicode.clearDetail();
    return;
  }

  unicode.displayedPoint = point;
  $el('#copy-button').disabled = false;

  var pointBin = util.toBin(point, 16);
  var pointHex = util.toHex(point, true);
  var ch = '&#' + point;
  var utf8 = 'UTF-8: ' + unicode.dumpUTF8Bytes(point);
  var utf16 = 'UTF-16:\n';

  utf16 += 'BE: ' + unicode.dumpUTF16Bytes(point) + '\n';
  utf16 += 'LE: ' + unicode.dumpUTF16Bytes(point, true);

  var cpname = '';
  var chClz = '';
  var pointDef = unicode.CTRL_CHRS[point];

  if (pointDef) {
    chClz = 'ctrl-char-l';
    if (pointDef.chr) ch = pointDef.chr;
    cpname = pointDef.desc;
  }

  var hex = util.lpad(pointHex, '0', 4);
  var codepoint = 'U+' + util.lpad(hex, '0', 4);
  var pointVal = '';

  pointVal += 'HEX: ' + util.lpad(pointHex, '0', 2) + '\n';
  pointVal += 'DEC: ' + point + '\n';
  pointVal += 'BIN: ' + pointBin + '\n';
  pointVal += '&amp;#x' + pointHex + '; ';
  pointVal += '&amp;#' + point + ';';
  pointVal += '\n\n';
  pointVal += utf8 + '\n';
  pointVal += utf16;

  $el('#char-wrapper').innerHTML = '<div id="char" class="' + chClz + '">' + ch + '</div>';
  $el('#codepoint').innerHTML = codepoint;
  $el('#cp-name').innerHTML = cpname;
  $el('#point-val').innerHTML = pointVal;
};

unicode.clearDetail = function() {
  unicode.displayedPoint = -1;
  $el('#copy-button').disabled = true;

  $el('#char-wrapper').innerHTML = '';
  $el('#codepoint').innerHTML = '';
  $el('#cp-name').innerHTML = '';
  $el('#point-val').innerHTML = '';
};

unicode.ch2point = function(ch) {
  var p = (ch.codePointAt ? ch.codePointAt(0) : ch.charCodeAt(0));
  if ((p === undefined) || isNaN(p)) p = -1;
  return p;
};

unicode.showPoint = function(val, base) {
  var r = $el('#point-radix').value;
  unicode.searchPoint(val, r);
};

unicode.searchPoint = function(val, base) {
  if (val == '') {
    unicode.clearChar();
    return;
  }

  var point;

  if (base == 10) {
    point = val | 0;
  } else {
    point = ('0x' + val) | 0;
  }

  unicode.showTable(-1, point);
};

unicode.searchPointByUTF8 = function(v) {
  v = v.replace(/[%\s]/g, '');
  var a = v.match(/.{2}/g);

  if (!a) return;

  var u = '';

  for (var i = 0; i < a.length; i++) {
    u += '%' + a[i];
  }

  try {
    var s = decodeURI(u);
    var p = s.codePointAt(0);
    unicode.searchPoint(p, 10);
  } catch (e) {
    util.infotip.show('ERROR', {style: {'font-size': '18px'}});
  }
};

unicode.toggleCharacterLock = function(point) {
  if (point == unicode.lockedPoint) {
    unicode.unlockSelectedCharacter();
  } else {
    unicode.lockSelectedCharacter(point);
  }
}

unicode.lockSelectedCharacter = function(point) {
  unicode.showDetails(point);
  unicode.showTable(unicode.start, point);
  unicode.updateLed(point);
};

unicode.unlockSelectedCharacter = function() {
  unicode.clearChar();
};

unicode.clearChar = function() {
  unicode.lockedPoint = -1;
  point = -1;
  unicode.showTable(unicode.start, point);
};

unicode.copy = function() {
  var p = unicode.displayedPoint;

  if (p == -1) return;

  try {
    var s = String.fromCodePoint(p);
    util.copy(s);
    unicode.showInfotip('Copied');
  } catch (e) {}
};

unicode.setRows = function(rows) {
  unicode.showTable(unicode.start, unicode.lockedPoint, null, rows);
};

unicode.setFont = function(font) {
  $el('#char-wrapper').style.fontFamily = font;
  unicode.setTableFont(font);
};

unicode.setTableFont = function(font) {
  var tds = $el('.unicode-body');

  if (!tds) return;

  for (var i = 0; i < tds.length; i++) {
    tds[i].style.fontFamily = font;
  }
};

unicode.getURL = function() {
  var start = unicode.start;

  if (start) {
    start = util.toHex(start, true);
  }

  var target = unicode.lockedPoint;

  if (target != -1) {
    target = util.toHex(unicode.lockedPoint, true);
  }

  var rows = unicode.rows;
  var q = '';

  if (start) {
    q += 'start=0x' + start;
  }

  if (target) {
    if (q) {
      q += '&';
    }

    q += 'p=0x' + target;
  }

  if (rows != unicode.DFLT_ROWS) {
    if (q) {
      q += '&';
    }

    q += 'rows=' + rows;
  }

  var url = location.origin + location.pathname;

  if (q) {
    url += '?' + q;
  }

  return url;
};

unicode.onChangeTooltip = function() {
  unicode.toggleTooltip();
};

unicode.applyTooltipState = function() {
  var enabled = $el('#chk-tooltip').checked;
  var cells = document.querySelectorAll('.unicode-body');

  for (var i = 0; i < cells.length; i++) {
    if (enabled) {
      var attr = cells[i].getAttribute('data-code-tooltip');
      cells[i].setAttribute('data-tooltip', attr);
    } else {
      cells[i].removeAttribute('data-tooltip');
    }
  }

  if (!enabled) {
    util.tooltip.hide();
  }
};

unicode.toggleTooltip = function() {
  unicode.applyTooltipState();
  unicode.setButtonStyle();
};

unicode.setButtonStyle = function() {
  if (unicode.autoScrolling) {
    util.addClass('#auto-button', 'button-active');
  } else {
    util.removeClass('#auto-button', 'button-active');
  }

  if (unicode.autoStep) {
    util.addClass('#auto-seq-button', 'button-active');
  } else {
    util.removeClass('#auto-seq-button', 'button-active');
  }
};

unicode.copyURL = function() {
  var url = unicode.getURL();
  util.copy(url);
  unicode.showInfotip('The URL has been copied to clipboard.');
};

unicode.getUTF8bytes = function(a) {
  var ch;

  if (typeof a == 'number') {
    var el = document.createElement('div');
    el.innerHTML = '&#' + a;
    ch = el.innerText;
  } else {
    ch = a;
  }

  var b = util.utf8.toByteArray(ch);
  return b;
};

unicode.getUTF8byteSeq = function(b) {
  var len = b.length;
  var s = '';

  for (var i = 0; i < len; i++) {
    if (i > 0) {
      s += ' ';
    }

    s += util.toHex(b[i], true, 2);
  }

  s += ' (' + len + util.plural('byte', len) + ')';
  s += '\n';

  for (i = 0; i < 4; i++) {
    var v = b[i];

    s += '[' + i + '] ';

    if (v != undefined) {
      s += util.toHex(v, true, 2, '0x');
      s += ' ';
      s += util.toBin(v, 8);
    }

    s += '\n';
  }

  return s;
};

unicode.dumpUTF8Bytes = function(p) {
  var b = unicode.getUTF8bytes(p);
  var d = unicode.getUTF8byteSeq(b);
  return d;
};

unicode.dumpUTF16Bytes = function(p, le) {
  var a = unicode._dumpUTF16Bytes(p, le);
  var b = '';

  for (var i = 0; i < a.length; i++) {
    if (i > 0) b += ' ';
    b += a[i];
  }

  return b;
};

unicode._dumpUTF16Bytes = function(p, le) {
  var c = String.fromCodePoint(p);
  var b = escape(c).replace(/[%u]/g, '');

  if (b.length == 1) {
    b = ('0' + b.charCodeAt(0).toString(16).toUpperCase()).slice(-2);
  }

  if (b.length == 2) b = '00' + b;

  var a = util.divideString(b, 2);

  if (le) {
    var d = [];

    for (var i = 0; i < a.length; i += 2) {
      d.push(a[i + 1]);
      d.push(a[i]);
    }

    a = d;
  }

  return a;
};

unicode.getUnicodeEscape = function(s) {
  var s = $el('#text').value;
  var u = '';

  for (var i = 0; i < s.length; i++) {
    var c = s.substring(i, i + 1);
    var p = unicode.ch2point(c);

    if (p <= 127) {
      u += c;
    } else {
      u += unicode._getUnicodeEscape(p);
    }
  }

  $el('#unicodeescape').value = u;
};

unicode._getUnicodeEscape = function(p) {
  var b = unicode.dumpUTF16Bytes(p);
  b = b.replace(/ /g, '');

  if (b.length == 8) {
    var u = '\\u' + b.substring(0, 2) + '\\u' + b.substring(2, 4);
  } else {
    u = '\\u' + b;
  }

  return u;
};

unicode.autoScrolling = false;

unicode.autoDisp = function(ms) {
  if (ms == undefined) ms = 80;

  var buf = new dbg.TextBuffer();

  buf.add('@echo off');
  buf.add('LOOP (');
  buf.add('$el(\'#next-row-button\').click()');
  buf.add('wait ' + ms);
  buf.add(')');

  dbg.bat(buf.toString());
  unicode.autoScrolling = true;
};

unicode.startStopAutoRow = function() {
  if (unicode.autoScrolling) {
    dbg.bat.stop();
    unicode.autoScrolling = false;
  } else {
    unicode.autoDisp(5);
  }

  unicode.setButtonStyle();
};

unicode.autoStep = false;

unicode.startStopAutoStep = function() {
  if (unicode.autoStep) {
    dbg.bat.stop();
    unicode.autoStep = false;
  } else {
    unicode.autoStepBat(5);
  }

  unicode.setButtonStyle();
};

unicode.autoStepBat = function(ms, startP) {
  if (startP == undefined) startP = unicode.displayedPoint;
  if (startP == null) startP = unicode.start;

  var buf = new dbg.TextBuffer();

  buf.add('@echo off');
  buf.add('${p} = ' + startP);
  buf.add('LOOP (');
  buf.add('unicode.toggleCharacterLock(${p})');
  buf.add('${p}++');
  buf.add('wait ' + ms);
  buf.add(')');

  dbg.bat(buf.toString());
  unicode.autoStep = true;
};

unicode.showInfotip = function(s) {
  util.infotip.show(s, 1500, {pos: 'pointer'});
};

unicode.textareaListener = function(data) {
  var point = data.codePoint;

  if (point == undefined) {
    unicode.showTable(-1);
    unicode.showDetails(-1);
    unicode.updateLed(-1);
    unicode.clearChar();
  } else {
    unicode.showTable(-1, point);
    unicode.updateLed(point);
  }

  unicode.getUnicodeEscape();
};

unicode.onWheel = function(e) {
  e.preventDefault();
  var start = unicode.currentStart;
  if (e.deltaY > 0) {
    unicode.showTable(start + 16);
  } else {
    unicode.showTable(start - 16);
  }
};

$onKeyDown = function(e) {
  if (e.keyCode == 13) {
    if (util.hasFocus('#target-point')) {
      unicode.showPoint($el('#target-point').value);
    } else if (util.hasFocus('#utf8')) {
      unicode.searchPointByUTF8($el('#utf8').value);
    } else if (util.hasFocus('#rows')) {
      unicode.setRows($el('#rows').value);
    } else if (util.hasFocus('#char-font')) {
      unicode.setFont($el('#char-font').value);
    }
  }
};

$onMouseDown = function(e) {
  if (e.button == 0) {
    util.tooltip.hide();
  }
};
</script>
</head>

<body>
<div id="main">
<div id="content">

<div style="position:relative;">
<h1>Unicode Table</h1>

<div style="display:inline-block;position:relative;left:20px;">
<button id="auto-button" class="small-button" onclick="unicode.startStopAutoRow();"style="margin-left:4px;">ROW AUTO</button>
<button id="auto-seq-button" class="small-button" onclick="unicode.startStopAutoStep();"style="margin-left:4px;">STEP AUTO</button>

<span style="margin-left:4px;">
<button class="small-button" onclick="unicode.copyURL();">Copy URL</button>
</span>

<span style="margin-left:4px;">
<input type="checkbox" id="chk-tooltip"><label for="chk-tooltip" style="font-size:12px;">Tooltip</label>
</span>

</div>
</div>

<div class="line"></div>

<div style="display:inline-block;position:relative;width:890px;margin-bottom:4px;">
<span>
U+<input type="text" id="target-point" style="width:54px;">
<select id="point-radix">
<option value="10">10</option>
<option value="16" selected>16</option>
</select>
<button class="small-button" onclick="unicode.showPoint($el('#target-point').value);" style="margin-left:2px;">SHOW</button>
</span>

<span style="margin-left:16px;">
UTF-8:<input type="text" id="utf8" style="width:90px;"><button class="small-button" onclick="unicode.searchPointByUTF8($el('#utf8').value);" style="margin-left:2px;">SHOW</button>
</span>

<span style="margin-left:16px;">
Font:<input type="text" id="char-font" style="width:80px;" oninput="unicode.setFont($el('#char-font').value);" onchange="unicode.setFont($el('#char-font').value);">
</span>

<div style="display:inline-block;position:absolute;right:0;">
  <span style="margin-right:8px;">Rows:<input type="text" id="rows" style="width:25px;" value="16"></span>
  <button onclick="unicode.showTable(unicode.prevPgPoint);" class="jump-button small-button2" id="prev-pg-button">&#x2191;&#x2191;</button>
  <button onclick="unicode.showTable(unicode.prevRowPoint);" class="jump-button small-button2" id="prev-row-button" style="margin-left:2px;">&#x2191;</button>
  <button onclick="unicode.showTable(unicode.nextRowPoint);" class="jump-button small-button2" id="next-row-button">&#x2193;</button>
  <button onclick="unicode.showTable(unicode.nextPgPoint);" class="jump-button small-button2" id="next-pg-button" style="margin-left:4px;">&#x2193;&#x2193;</button>
</div>
</div><br>

<div class="code-area">
  <div id="code-table-wrapper">
    <div id="code-table"></div>
    <div style="margin-top:8px;">
      <textarea id="text" spellcheck="false"></textarea>
    </div>
    <div>
      <textarea id="unicodeescape" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="code-side">
    <div id="code-info">
    <pre style="width:100%;height:100%;">
<span id="codepoint"></span><span style="position:absolute;right:4px;"><button id="copy-button" onclick="unicode.copy();" data-tooltip="Copy" disabled>&#x29C9;</button></span>
<div id="char-wrapper1"><div id="char-wrapper"></div></div><div id="cp-name" class="ctrl-char-l"></div><div id="point-val"></div>
</pre>
  </div>

  <div style="display:inline-block;margin-top:4px;line-height:1.3em;font-size:12px;">
    <table>
    <tr>
    <td style="white-space:nowrap;vertical-align:top;">
      <span id="led-bmp"></span><button onclick="unicode.onClickCodeblock(this, 0);" class="codeblock-button" data-tooltip="Basic Multilingual Plane">U+0000(BMP)</button><br>

      <div style="margin-left:12px;line-height:1.3em;">
        <span id="led-u0000"></span><button onclick="unicode.onClickCodeblock(this, 0x0000);" class="codeblock-button">U+0000</button>ASCII<br>
        <span id="led-u0370"></span><button onclick="unicode.onClickCodeblock(this, 0x0370);" class="codeblock-button">U+0370</button>Ελληνική<br>
        <span id="led-u0400"></span><button onclick="unicode.onClickCodeblock(this, 0x0400);" class="codeblock-button">U+0400</button>Кириллица<br>
        <span id="led-u0600"></span><button onclick="unicode.onClickCodeblock(this, 0x0600);" class="codeblock-button">U+0600</button>عربی حروف تہجی<br>
        <span id="led-u0e00"></span><button onclick="unicode.onClickCodeblock(this, 0x0E00);" class="codeblock-button">U+0E00</button>อักษรไทย<br>
        <span id="led-u2000"></span><button onclick="unicode.onClickCodeblock(this, 0x2000);" class="codeblock-button">U+2000</button>Symbols<br>
